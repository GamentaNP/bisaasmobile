name: bisaasmobile
description: CivilCal Flutter Client - Market-Dominating Mobile Learning for Engineering Students (Android/iOS) - Bisaas Ecosystem Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === STATE MANAGEMENT ===
  flutter_riverpod: ^3.4.2

  # === NAVIGATION ===
  go_router: ^18.0.0

  # === NETWORKING - BiSaaS API v1 only ===
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # === LOCAL DATABASE (offline packs) ===
  drift: ^2.21.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # === SECURE STORAGE (tokens) ===
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.4

  # === FIREBASE (FCM, Analytics, Crashlytics, Auth, RTDB) ===
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  firebase_auth: ^6.6.1
  firebase_database: ^12.0.1

  # === NOTIFICATIONS ===
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # === IMAGE ===
  cached_network_image: ^4.0.0
  image_picker: ^1.1.2

  # === CONNECTIVITY ===
  connectivity_plus: ^7.3.1

  # === HAPTICS / SHARING ===
  vibration: ^3.2.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.1

  # === CHARTS / ANIMATIONS ===
  fl_chart: ^1.2.0
  lottie: ^3.1.3

  # === MATH ===
  flutter_math_fork: ^0.7.3

  # === BIOMETRICS ===
  local_auth: ^3.0.2

  # === DEEP LINKS (civilcal:// + https app links) ===
  app_links: ^6.3.2

  # === CERT PINNING (SHA-256 of leaf cert) ===
  crypto: ^3.0.3

  # === LOGGING / ERROR ===
  logger: ^2.5.0
  sentry_flutter: ^9.28.0

  # === I18N / UTILS ===
  intl: ^0.20.3
  uuid: ^4.5.2
  meta: any
  freerasp: ^8.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  # very_good_analysis already pulls flutter_lints — do not double-include.
  very_good_analysis: ^10.3.0
  # Only drift codegen is used. The freezed / json_serializable /
  # riverpod_generator chain was removed: the project hand-writes every
  # fromJson and the sole generated file is app_database.g.dart.
  build_runner: ^2.4.14
  drift_dev: ^2.21.0
  mocktail: ^1.0.4
  # integration_test/patrol intentionally omitted — their native plugins have
  # no release variant and break `flutter build appbundle` (flutter/flutter#92978).
  # Reintroduce as a dedicated E2E harness package in Phase 6 (testing pyramid).
  flutter_launcher_icons: ^0.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/translations/
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700

    # Non-Latin scripts are bundled rather than left to the OEM.
    #
    # The universal chain in lib/app/theme/script_fonts.dart already asks for
    # these families by name, but until they were declared here Flutter silently
    # fell through to the platform's `sans-serif`. That works on a Redmi (Android
    # ships Noto) and fails on any OEM that ships a trimmed font set, where the
    # user sees tofu boxes for exactly the languages the app is built for.
    #
    # Family names match script_fonts.dart one-for-one. Only Regular is bundled:
    # Flutter synthesises other weights, and shipping 5 weights x 6 scripts would
    # add ~20 MB to the bundle for no legibility gain.
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/noto/NotoSansDevanagari-Regular.ttf
          weight: 400
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/noto/NotoSansBengali-Regular.ttf
          weight: 400
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/noto/NotoSansTamil-Regular.ttf
          weight: 400
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/noto/NotoSansTelugu-Regular.ttf
          weight: 400
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/noto/NotoSansArabic-Regular.ttf
          weight: 400
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/noto/NotoSansSC-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.svg"
  adaptive_icon_background: "#0B0F17"
  adaptive_icon_foreground: "assets/images/logo_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 29
