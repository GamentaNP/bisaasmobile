name: bisaasmobile
description: CivilCal Flutter Client - Market-Dominating Mobile Learning for Engineering Students (Android/iOS) - Bisaas Ecosystem Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # === STATE MANAGEMENT ===
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # === NAVIGATION ===
  go_router: ^18.0.0

  # === NETWORKING - BiSaaS API v1 only ===
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # === LOCAL DATABASE (offline packs) ===
  drift: ^2.21.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # === SECURE STORAGE (tokens) ===
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.4

  # === CODE GENERATION ===
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # === FIREBASE (FCM, Analytics, Crashlytics, RemoteConfig) ===
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  firebase_remote_config: ^6.6.0

  # === NOTIFICATIONS ===
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # === IMAGE ===
  cached_network_image: ^4.0.0
  flutter_svg: ^2.0.12
  image_picker: ^1.1.2

  # === CONNECTIVITY ===
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

  # === HAPTICS / SHARING ===
  vibration: ^3.2.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.1

  # === CHARTS / ANIMATIONS ===
  fl_chart: ^1.2.0
  lottie: ^3.1.3
  flutter_animate: ^4.5.0
  shimmer: ^4.0.0

  # === MATH / MARKDOWN ===
  flutter_math_fork: ^0.7.3
  flutter_markdown: ^0.7.4

  # === BIOMETRICS / PERMISSIONS ===
  local_auth: ^3.0.2
  permission_handler: ^13.0.1

  # === DEEP LINKS (civilcal:// + https app links) ===
  app_links: ^6.3.2

  # === CERT PINNING (SHA-256 of leaf cert) ===
  crypto: ^3.0.3

  # === LOGGING / ERROR ===
  logger: ^2.5.0
  sentry_flutter: ^9.28.0

  # === RATINGS ===
  in_app_review: ^2.0.10

  # === I18N / UTILS ===
  intl: ^0.20.3
  path_provider: ^2.1.5
  google_sign_in: ^7.2.0
  collection: ^1.18.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # very_good_analysis already pulls flutter_lints — do not double-include.
  very_good_analysis: ^10.3.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  patrol: ^4.9.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/translations/
  # fonts:
