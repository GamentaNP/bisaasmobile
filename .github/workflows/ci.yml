name: CI
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --coverage
      # Gate is a floor to stop regressions; the committed roadmap target is 70%.
      - run: dart scripts/coverage_check.dart --min=40
      - run: flutter gen-l10n

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - run: flutter pub get

      # Release signing must be real, or the artifact is explicitly marked
      # unpublishable. build.gradle.kts fails the build otherwise by design.
      - name: Materialise upload keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets configured — building a DEBUG-SIGNED artifact. Do not distribute it."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk \
            --dart-define=ENV=prod --dart-define=APP_VERSION=${{ github.ref_name }} \
            --dart-define-from-file=dart_defines/production.json \
            --obfuscate --split-debug-info=build/symbols \
            ${{ steps.signing.outputs.signed == 'false' && '-Pallow-debug-signing=true' || '' }}

      - name: Build App Bundle
        run: |
          flutter build appbundle \
            --dart-define=ENV=prod --dart-define=APP_VERSION=${{ github.ref_name }} \
            --dart-define-from-file=dart_defines/production.json \
            --obfuscate --split-debug-info=build/symbols \
            ${{ steps.signing.outputs.signed == 'false' && '-Pallow-debug-signing=true' || '' }}

      # Symbols are needed to decode obfuscated crash reports and must never be
      # published alongside the artifact.
      - name: Archive obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-${{ github.sha }}
          path: build/symbols
          retention-days: 90

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
