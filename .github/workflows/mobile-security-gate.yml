name: Mobile Security Gate

# Security plan W2.8 — the mobile release security gate.
#
# One workflow: secret scan → dependency audit → analyze → tests →
# obfuscated release build → UNPACK THE REAL ARTIFACT and fail on forbidden
# content (credentials, premium/answer assets, databases, symbols).
#
# This gate intentionally does NOT publish anything. Its release build uses
# the same keystore secret as deploy when available; on fork/PR runs where
# secrets are hidden, it falls back to an explicitly debug-signed build that
# is used for the artifact scan only and deleted afterwards — a scan of the
# real payload does not require a publishable signature, but it does require
# the real payload.

on:
  push:
    branches: [master, main, develop, development]
  pull_request:
    branches: [master, main, develop, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      # Fails the gate when a transitive dependency carries a known advisory
      # (dart pub audit does not exist; the OSV-Scanner path is the honest
      # equivalent for a pub + CocoaPods + Gradle dependency set).
      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --format=table
            --recursive
            ./

  analyze-and-test:
    name: Analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --fatal-infos
      - run: flutter test

  artifact-gate:
    name: Obfuscated release build + artifact scan
    needs: [secret-scan, analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Real keystore when the secret exists (push runs on the home repo);
      # an explicitly debug-signed throwaway otherwise (PRs from forks),
      # which is fine for scanning the payload — this artifact is never
      # uploaded anywhere except the scanner and a private debug artifact.
      - name: Materialise upload keystore (if secret present)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Obfuscated release build (W2.1 flags mandatory)
        run: |
          if [ -f android/key.properties ]; then
            flutter build apk --release --dart-define=ENV=prod \
              --dart-define-from-file=dart_defines/production.json \
              --obfuscate --split-debug-info=build/symbols/gate
          else
            flutter build apk --release --dart-define=ENV=prod \
              --dart-define-from-file=dart_defines/production.json \
              --obfuscate --split-debug-info=build/symbols/gate \
              -Pallow-debug-signing=true
          fi

      - name: Scan the real artifact (fails on forbidden content)
        run: bash scripts/scan_release_artifact.sh build/app/outputs/flutter-apk/app-release.apk

      # Symbols stay private: archived for crash de-obfuscation, never served.
      - name: Archive obfuscation symbols privately
        if: always() && hashFiles('build/symbols/gate/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: obfuscation-symbols-${{ github.sha }}
          path: build/symbols/gate/
          retention-days: 90

      - name: Delete keystore material (always, even on failure)
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
