org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The Flutter Gradle plugin, when the build does not use --split-per-abi,
# *overwrites* the app's `ndk.abiFilters` with the full list it supports:
#
#     extension.defaultConfig.ndk {
#         abiFilters.clear()
#         abiFilters.addAll(PLATFORM_ABI_LIST)
#     }
#
# so an app-level filter cannot remove a slice — it can only add to a list
# that already contains it. `disable-abi-filtering=true` tells the plugin to
# leave the ABI list alone, which is what lets
# `android/app/build.gradle.kts` ship arm64-v8a and armeabi-v7a only and
# drop the x86_64 slice (~21 MB of upload for a platform the Play Store
# never serves to a real device).
#
# It only affects the release variant: the filter is set inside the
# `buildingRelease` branch, so a debug build keeps every ABI and the x86_64
# emulator still runs it.
disable-abi-filtering=true
